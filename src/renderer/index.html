<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' file:; img-src 'self' data: file:;" />
    <title>流萤桌宠</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="stage">
      <!-- 头顶气泡：说话 / 提示 -->
      <div id="bubble" class="bubble" aria-live="polite"><span id="bubble-text"></span></div>

      <!-- 粒子层：爱心、星光、蝴蝶、技能光环 -->
      <div id="fx" class="fx"></div>

      <!-- 宠物本体：两套姿势（参考图站姿 / 参考图坐姿+可摆动双腿），交叉淡入切换 -->
      <div id="pet" class="pet" title="拖我一下试试～">
        <div class="ground-glow"></div>
        <div class="pet-scaler">
          <div class="pet-aura"></div>
          <div id="sprite" class="sprite">
            <div class="pet-sway">
              <!-- 站姿 -->
              <div id="pose-stand" class="pose">
                <img id="pet-img" class="pose-img" src="../../assets/stand.png" alt="流萤" draggable="false" />
              </div>
              <!-- 坐姿：身体 + 左右腿（腿绕髋部摆动） -->
              <div id="pose-sit" class="pose hidden">
                <img id="sit-body" class="pose-img" src="../../assets/sit-body.png" alt="" draggable="false" />
                <img id="sit-leg-l" class="pose-img leg leg-l" src="../../assets/sit-leg-l.png" alt="" draggable="false" />
                <img id="sit-leg-r" class="pose-img leg leg-r" src="../../assets/sit-leg-r.png" alt="" draggable="false" />
              </div>
            </div>
          </div>
        </div>
        <div class="shadow"></div>
      </div>
    </div>

    <script src="fx.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
